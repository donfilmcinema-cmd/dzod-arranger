name: Build DZOD Arranger

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (DZOD Arranger.exe + DZODArrangerTool)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: cmake -S . -B build -A x64 2>&1 | tee configure.log; exit ${PIPESTATUS[0]}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel --target ArrangerApp ArrangerTool 2>&1 | tee build.log | grep -E "error|warning C4(700|715)" | head -200; exit ${PIPESTATUS[0]}

      - name: Self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter DZODArrangerTool.exe | Select-Object -First 1
          & $exe.FullName selftest *> selftest.txt
          $code = $LASTEXITCODE
          Get-Content selftest.txt
          "exit $code" | Add-Content selftest.txt
          if ($code -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+) LANGUAGES').Matches[0].Groups[1].Value
          $d = "dist/DZOD Arranger $v"
          New-Item -ItemType Directory -Force $d | Out-Null
          $app = Get-ChildItem -Recurse build -Filter "DZOD Arranger.exe" | Select-Object -First 1
          Copy-Item $app.FullName $d/
          Copy-Item INSTALL_RU.txt $d/
          Copy-Item app/fonts/OFL.txt "$d/PT Sans - OFL.txt"
          Compress-Archive -Path $d -DestinationPath "dist/DZOD_Arranger_$v.zip"
          $tool = Get-ChildItem -Recurse build -Filter DZODArrangerTool.exe | Select-Object -First 1
          Copy-Item $tool.FullName dist/
          Copy-Item selftest.txt dist/

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: DZOD-Arranger-Windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

      - name: Publish to branch builds (артефакты Actions из чата Claude не скачать — забираем git fetch)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p dist
          cp -f configure.log build.log dist/ 2>/dev/null || true
          cd dist
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "commit ${GITHUB_SHA}" > BUILD_INFO.txt
          echo "run ${GITHUB_RUN_ID}" >> BUILD_INFO.txt
          echo "status ${{ job.status }}" >> BUILD_INFO.txt
          git add -A && git commit -qm "Windows build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" builds

  linux:
    name: Linux (ядро, проверка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDZOD_BUILD_APP=OFF && cmake --build build --parallel --target ArrangerTool
      - run: ./build/DZODArrangerTool selftest
