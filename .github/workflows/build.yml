name: Build DZOD Arranger

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (ядро + DZODArrangerTool)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target ArrangerTool

      - name: Self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter DZODArrangerTool.exe | Select-Object -First 1
          & $exe.FullName selftest *> selftest.txt
          $code = $LASTEXITCODE
          Get-Content selftest.txt
          "exit $code" | Add-Content selftest.txt
          if ($code -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Recurse build -Filter DZODArrangerTool.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/
          Copy-Item README_RU.md dist/
          Copy-Item selftest.txt dist/

      - name: Publish to branch builds (артефакты Actions из чата Claude не скачать — забираем git fetch)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cd dist
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "commit ${GITHUB_SHA}" > BUILD_INFO.txt
          echo "run ${GITHUB_RUN_ID}" >> BUILD_INFO.txt
          git add -A && git commit -qm "Windows build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" builds

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: DZOD-Arranger-Windows
          path: dist
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux (проверка сборки)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel --target ArrangerTool
      - run: ./build/DZODArrangerTool selftest
